name: Build OpenJDK 21 for iOS

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 1 1 */2 *"

jobs:
  build_ios:
    name: "Build Java 21 for iOS aarch64"
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Install dependencies
        run: brew install wget

      - name: Build with CI build script
        run: |
          export JAVA_HOME=$(/usr/libexec/java_home -v 21)
          export BUILD_IOS=1
          export TARGET_VERSION=21
          bash "1_ci_build_arch_aarch64.sh"

      - name: Upload JDK build output
        uses: actions/upload-artifact@v4
        with:
          name: "jdk21-ios-aarch64"
          path: jdk21-ios*.tar.xz

      - name: Upload JRE build output
        uses: actions/upload-artifact@v4
        with:
          name: "jre21-ios-aarch64"
          path: jre21-ios*.tar.xz

      - name: Upload JRE debuginfo build output
        uses: actions/upload-artifact@v4
        with:
          name: "jre21-ios-debuginfo-aarch64"
          path: dizout
